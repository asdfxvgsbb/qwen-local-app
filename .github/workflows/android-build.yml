name: qwen-local-app-build

on:
  workflow_dispatch:   # 仅手动触发，避免 push 重复跑

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ========== 1. 安装 JDK17 ==========
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ========== 2. 准备 Android SDK（定位 sdkmanager） ==========
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          # 定位 sdkmanager（GitHub runner 预装于 cmdline-tools/latest/bin）
          if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          else
            echo "未找到 sdkmanager，安装 cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd /tmp
            curl -sL -o clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q clt.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -3 || true
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          # 写 local.properties 供 Gradle 定位
          echo "sdk.dir=$SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"
          ls "$SDK_ROOT/build-tools/" "$SDK_ROOT/platforms/" 2>/dev/null

      # ========== 2b. 下载官方预编译 llama.cpp Android arm64 ==========
      - name: Download llama.cpp android arm64 prebuilt
        run: |
          set -e
          # 官方 nightly 预编译包（服务器直连 GitHub 很快）
          URL="https://github.com/ggml-org/llama.cpp/releases/download/b12212/llama-b12212-bin-android-arm64.tar.gz"
          echo "下载: $URL"
          curl -sL "$URL" -o /tmp/llama-android.tar.gz || \
          curl -sL "https://gh-proxy.com/$URL" -o /tmp/llama-android.tar.gz
          ls -la /tmp/llama-android.tar.gz
          mkdir -p /tmp/llama-unpack
          tar -xzf /tmp/llama-android.tar.gz -C /tmp/llama-unpack
          echo "=== 解压内容 ==="
          find /tmp/llama-unpack -type f | head -40

      # ========== 2c. 收集 llama-server 和 .so 到 assets ==========
      - name: Collect llama binaries to assets
        run: |
          set -e
          mkdir -p app/src/main/assets
          FOUND_BIN=$(find /tmp/llama-unpack -name "llama-server*" -type f | head -1)
          echo "llama-server: $FOUND_BIN"
          if [ -z "$FOUND_BIN" ]; then
            echo "!! 没找到 llama-server，列出全部文件："
            find /tmp/llama-unpack -type f | head -50
            exit 1
          fi
          # gzip 压缩 llama-server + 所有 .so
          gzip -9 -c "$FOUND_BIN" > app/src/main/assets/llama-server.gz
          echo "llama-server.gz: $(stat -c%s app/src/main/assets/llama-server.gz) bytes"
          # 收集 .so 库
          find /tmp/llama-unpack -name "*.so" -type f | while read so; do
            name=$(basename "$so")
            gzip -9 -c "$so" > "app/src/main/assets/$name.gz"
            echo "  $name.gz: $(stat -c%s app/src/main/assets/$name.gz) bytes"
          done
          ls -la app/src/main/assets/

      # ========== 4. 编译 APK ==========
      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          # 没有 wrapper 时用系统 gradle
          echo "Check gradle wrapper..."
          ls -la gradle/wrapper/ 2>/dev/null || echo "no wrapper"
          # 直接生成 wrapper 或用 gradle 命令
          if [ ! -f gradlew ]; then
            ls $ANDROID_HOME/../ 2>/dev/null || true
            echo "Generating gradle wrapper manually..."
          fi
          # 用 sdkmanager 装的 gradle 不行，直接下载 gradle 7.5
          curl -sL https://services.gradle.org/distributions/gradle-7.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          /opt/gradle-7.5/bin/gradle wrapper --gradle-version 7.5 2>&1 | tail -3 || true
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tail -30

      # ========== 5. 上传 APK ==========
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qwen-local-app-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error