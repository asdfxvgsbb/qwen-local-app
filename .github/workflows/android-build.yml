name: qwen-local-app-build

on:
  workflow_dispatch:   # 仅手动触发，避免 push 重复跑

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ========== 1. 安装 JDK17 ==========
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ========== 2. 准备 Android SDK（定位 sdkmanager） ==========
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          # 定位 sdkmanager（GitHub runner 预装于 cmdline-tools/latest/bin）
          if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          else
            echo "未找到 sdkmanager，安装 cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd /tmp
            curl -sL -o clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q clt.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653" "ndk;26.1.10909125" 2>&1 | tail -3 || true
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          # 写 local.properties 供 Gradle 定位
          echo "sdk.dir=$SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"
          ls "$SDK_ROOT/build-tools/" "$SDK_ROOT/platforms/" "$SDK_ROOT/ndk/" 2>/dev/null

      # ========== 2. 交叉编译 llama.cpp (android arm64) ==========
      - name: Build llama.cpp for Android arm64
        run: |
          set -e
          SDK_ROOT=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          NDK=$(ls -d $SDK_ROOT/ndk/* | head -1)
          echo "Using NDK: $NDK"
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          echo "TOOLCHAIN=$TOOLCHAIN"

          # 下载 llama.cpp 源码（用 b10000 对应 tag，proot 下稳定版；Android 原生不受影响）
          git clone --depth 1 --branch b10000 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp || \
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cd /tmp/llama.cpp

          mkdir -p build-android && cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN/toolchain.cmake \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=26 \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=$NDK \
            -DCMAKE_ANDROID_NDK_TOOLCHAIN_VERSION=clang \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CPU=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_METAL=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON

          make -j$(nproc) llama-server 2>&1 | tail -5

          ls -la bin/
          BIN_FILES="bin"
          mkdir -p $GITHUB_WORKSPACE/llama-assets
          # 压缩 llama-server 和依赖 .so 到 assets（gzip）
          if [ -f bin/llama-server ]; then
            gzip -9 -c bin/llama-server > $GITHUB_WORKSPACE/llama-assets/llama-server.gz
            echo "llama-server size: $(stat -c%s $GITHUB_WORKSPACE/llama-assets/llama-server.gz)"
          fi
          # 收集 libggml*.so（dlopen 需要）
          for so in bin/*.so bin/../*.so; do
            if [ -f "$so" ]; then
              name=$(basename "$so")
              gzip -9 -c "$so" > "$GITHUB_WORKSPACE/llama-assets/$name.gz"
              echo "so: $name -> $(stat -c%s $GITHUB_WORKSPACE/llama-assets/$name.gz) bytes"
            fi
          done
          ls -la $GITHUB_WORKSPACE/llama-assets/

      # ========== 3. 把编译好的二进制复制到 app assets ==========
      - name: Copy llama binaries to assets
        run: |
          mkdir -p app/src/main/assets
          cp llama-assets/* app/src/main/assets/
          ls -la app/src/main/assets/

      # ========== 4. 编译 APK ==========
      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          # 没有 wrapper 时用系统 gradle
          echo "Check gradle wrapper..."
          ls -la gradle/wrapper/ 2>/dev/null || echo "no wrapper"
          # 直接生成 wrapper 或用 gradle 命令
          if [ ! -f gradlew ]; then
            ls $ANDROID_HOME/../ 2>/dev/null || true
            echo "Generating gradle wrapper manually..."
          fi
          # 用 sdkmanager 装的 gradle 不行，直接下载 gradle 7.5
          curl -sL https://services.gradle.org/distributions/gradle-7.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          /opt/gradle-7.5/bin/gradle wrapper --gradle-version 7.5 2>&1 | tail -3 || true
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tail -30

      # ========== 5. 上传 APK ==========
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qwen-local-app-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error